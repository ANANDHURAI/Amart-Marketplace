{% extends "home/base.html" %}
{% block content %}
<section class="signin-page account">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <div class="block text-center">
                    <h2 class="text-center">Forgot Password</h2>
                    <p>Enter your email address and we will send you an OTP to reset your password.</p>
                    <form method="post" class="text-left clearfix">
                        {% csrf_token %}
                        {% if messages %}
                            {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
                        {% endif %}
                        <div class="form-group">
                            <input required type="email" class="form-control" placeholder="Account Email" name="email">
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-main text-center">Send OTP</button>
                        </div>
                    </form>
                    <p class="mt-20"><a href="{% url 'customer_login' %}">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
