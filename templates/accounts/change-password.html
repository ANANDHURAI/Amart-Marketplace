{% extends "home/base.html" %}
{% block content %}
<section class="signin-page account">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <div class="block text-center">
                    <h2 class="text-center">Set New Password</h2>
                    <form method="post" class="text-left clearfix">
                        {% csrf_token %}
                        {% if messages %}
                            {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
                        {% endif %}
                        <div class="form-group">
                            <input required type="password" class="form-control" placeholder="New Password" name="password">
                        </div>
                        <div class="form-group">
                            <input required type="password" class="form-control" placeholder="Confirm New Password" name="password2">
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-main text-center">Reset Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
