
{% load static %}
<section class="section">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="title text-center reveal">
                    <h2>Shop by Category</h2>
                    <hr style="width: 50px; border-top: 3px solid var(--primary); margin: 20px auto;">
                </div>
            </div>
            {% for category in categories %}
            <div class="col-md-6 mb-4 reveal">
                <div class="category-card" style="position: relative; overflow: hidden; height: 400px; cursor: pointer;">
                    <img src="{{ category.image.url }}" style="width: 100%; height: 100%; object-fit: cover; transition: 0.5s all;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); color: #fff;">
                        <h3 style="margin-bottom: 5px;">{{ category.name }}</h3>
                        <p style="font-size: 0.9rem; opacity: 0.8;">{{ category.description }}</p>
                        <a href="#!" class="btn-link" style="color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;">Browse Now →</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
