{% load static %}
<section class="hero-area" style="background: #111; height: 90vh; display: flex; align-items: center; position: relative; overflow: hidden;">
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url({% static 'images/slider/slider-1.jpg' %}) center/cover no-repeat; opacity: 0.6;"></div>
    
    <div class="container" style="position: relative; z-index: 2;">
        <div class="row">
            <div class="col-md-12 text-center">
                <h1 style="color: #fff; font-size: 5rem; margin-bottom: 20px; animation: fadeInUp 1s ease;">
                    Elevate Your <span style="color: var(--accent);">Style</span>
                </h1>
                <p style="color: #eee; font-size: 1.2rem; max-width: 600px; margin: 0 auto 30px; animation: fadeInUp 1.2s ease;">
                    Discover the perfect blend of nature's beauty and modern fashion in our latest collection.
                </p>
                <a href="{% url 'shop' %}" class="btn btn-main" style="animation: fadeInUp 1.5s ease;">Explore Collection</a>
            </div>
        </div>
    </div>
</section>
