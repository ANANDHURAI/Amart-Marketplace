{% load static %}
<div class="product-item reveal" style="border: none; margin-bottom: 40px; transition: 0.3s all;">
    <div class="product-thumb" style="position: relative; overflow: hidden;">
        <img src="{% if product.primary_image %}{{ product.primary_image.image.url }}{% else %}{% static 'images/no-image.png' %}{% endif %}" 
             alt="{{ product.name }}" 
             style="width: 100%; height: 350px; object-fit: cover;">
        
        <div class="preview-meta" style="position: absolute; width: 100%; bottom: -50px; transition: 0.4s all; background: rgba(255,255,255,0.9); display: flex; justify-content: space-around; padding: 15px;">
            <a href="{% url 'add_to_favourite' product.id %}" style="color: #333;"><i class="tf-ion-ios-heart{% if product.is_favourite %}" style="color: red;{% else %}-outline"{% endif %}></i></a>
            <a href="#!" data-toggle="modal" data-target="#add-to-cart-modal-{{ product.id }}" style="color: #333;"><i class="tf-ion-android-cart"></i></a>
            <a href="#!" data-toggle="modal" data-target="#product-modal-{{ product.id }}" style="color: #333;"><i class="tf-ion-ios-search"></i></a>
        </div>
    </div>
    <div class="product-content text-center" style="padding-top: 15px;">
        <h4 style="font-family: 'Inter', sans-serif; font-size: 1rem; margin-bottom: 5px;">
            <a href="{% url 'product_page' product.slug %}" style="color: #333;">{{ product.name }}</a>
        </h4>
        <p class="price" style="font-weight: 800; font-size: 1.1rem; color: var(--primary);">₹{{ product.shop_price }}</p>
    </div>
</div>

<style>
    .product-item:hover .preview-meta { bottom: 0; }
    .product-item:hover { transform: translateY(-5px); }
</style>
