{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }} | Amart Fashions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{% static 'plugins/themefisher-font/style.css' %}">
  <link rel="stylesheet" href="{% static 'plugins/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'plugins/animate/animate.css' %}">
  <link rel="stylesheet" href="{% static 'plugins/slick/slick.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <style>
    :root { --primary: #111; --accent: #c5a059; }
    body { font-family: 'Inter', sans-serif; color: #333; overflow-x: hidden; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; font-weight: 700; }
    
    /* Modern Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    /* Reveal Animation on Scroll */
    .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
    .reveal.active { opacity: 1; transform: translateY(0); }

    .btn-main {
        background: var(--primary);
        color: #fff;
        padding: 12px 30px;
        border-radius: 0;
        transition: 0.3s all;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
    }
    .btn-main:hover { background: var(--accent); color: #fff; transform: translateY(-3px); }
  </style>
  {% block extra_styles %}{% endblock %}
</head>
<body id="body">

{% block content %}{% endblock %}

<script src="{% static 'plugins/jquery/dist/jquery.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap/js/bootstrap.min.js' %}"></script>
<script src="{% static 'plugins/slick/slick.min.js' %}"></script>

<script>
  // Simple Scroll Reveal Logic
  function reveal() {
    var reveals = document.querySelectorAll(".reveal");
    for (var i = 0; i < reveals.length; i++) {
      var windowHeight = window.innerHeight;
      var elementTop = reveals[i].getBoundingClientRect().top;
      if (elementTop < windowHeight - 100) { reveals[i].classList.add("active"); }
    }
  }
  window.addEventListener("scroll", reveal);
  
  // Auto-dismiss alerts
  setTimeout(() => {
    $('.alert').fadeOut('slow', function(){ $(this).remove(); });
  }, 2000);
</script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
